        <h1>Privacy Policy</h1>
        <p>Zero uploads, zero analytics, and zero cookies. Your documents never leave your device.</p>
        
        <section>
          <h2>1. Zero Uploads &amp; 100% Local Processing</h2>
          <p>Every PDF, image, CBZ archive, filename, form field value, and signature processed in Poffy stays strictly inside your browser memory on your own device. No files or document contents are ever transmitted to our servers or any third-party API.</p>
          <p>Poffy enforces a strict Content-Security-Policy (connect-src 'self'; object-src 'none'; frame-ancestors 'none') so browser runtime code cannot make outbound network requests to external servers.</p>
          
        </section>

        <section>
          <h2>2. No Analytics, Cookies, or Tracking</h2>
          <p>Poffy does not set tracking cookies, run analytics scripts, collect usage telemetry, or load external fonts, CDNs, or advertising pixels.</p>
          <ul><li>Zero cookies used for tracking or profiling</li><li>Zero third-party analytics or crash-reporting beacons</li><li>Zero outbound requests after static app assets load</li></ul>
        </section>

        <section>
          <h2>3. How Browser Memory &amp; Local Storage Are Used</h2>
          <p>While your documents never leave your device, browsers expose different local storage mechanisms for distinct purposes:</p>
          <ul><li>Volatile RAM (ArrayBuffers &amp; Web Workers): Holds opened files, page previews, and active edits solely during your open session. Closing, refreshing, or clicking Reset immediately discards all document data.</li><li>Offline Service Worker Cache (Workbox): Stores static application scripts, WASM binaries, CMaps, and fonts locally so Poffy works offline. User PDFs and edits are never written into the Service Worker cache.</li><li>Optional Signature Tray (localStorage): Only if you explicitly draw or save a reusable signature in Sign &amp; Annotate does Poffy store that transparent PNG signature locally under poffy_saved_signatures in browser localStorage, which you can clear anytime in one click.</li><li>Zero IndexedDB Document Persistence: Uploaded files are never persisted to IndexedDB.</li></ul>
        </section>

        <section>
          <h2>4. Static Website Hosting Logs</h2>
          <p>When you initially load Poffy over the internet, standard static web hosting infrastructure (such as Cloudflare Pages or Vercel) may temporarily process standard HTTP request logs (such as IP address, user-agent, and page path) solely to deliver the static HTML, JS, CSS, and WASM assets. Once cached as an offline PWA, Poffy operates with zero network traffic.</p>
          
        </section>

        <section>
          <h2>5. Transparency &amp; Source Verification</h2>
          <p>You can inspect Poffy's source code, security headers, worker isolation, and offline PWA manifest directly in the open-source repository on GitHub.</p>
          
        </section>
