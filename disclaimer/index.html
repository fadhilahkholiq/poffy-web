        <h1>Disclaimer</h1>
        <p>Important technical and legal notes on client-side PDF processing, signatures, redaction, and device memory limits.</p>
        
        <section>
          <h2>1. As-Is Software &amp; Document Backups</h2>
          <p>Poffy is provided on an &quot;as is&quot; and &quot;as available&quot; basis without warranties of any kind, express or implied, including fitness for a particular purpose or non-infringement.</p>
          <p>Always retain copies of your original PDF, image, or CBZ files before performing destructive edits, permanent redaction, flattening, or metadata scrubbing.</p>
          
        </section>

        <section>
          <h2>2. Electronic Signatures &amp; Legal Compliance</h2>
          <p>Drawn, typed, and stamped signatures created with Poffy Sign &amp; Annotate are visual vector/bitmap markings embedded onto PDF pages. They are not cryptographic digital certificates issued by a Certificate Authority (CA), nor do they replace qualified electronic signatures (such as eIDAS QES) where legally mandated.</p>
          
        </section>

        <section>
          <h2>3. Redaction &amp; Privacy Scrubbing Verification</h2>
          <p>Poffy provides permanent raster-burn redaction (burning selected regions or full pages in Paranoid Mode) and deep metadata scrubbing (clearing Info dictionaries, XMP streams, thumbnails, and document actions). However, complex PDFs can contain embedded artifacts or scanned text.</p>
          <p>Always open and inspect exported files independently to confirm all sensitive content has been removed to your satisfaction before sharing.</p>
          
        </section>

        <section>
          <h2>4. Local Device Memory &amp; Browser Limits</h2>
          <p>Because Poffy operates 100% inside your browser without server-side processing, maximum file size, batch rasterization resolution, and processing speed depend on your device hardware, available RAM, and browser tab memory limits.</p>
          
        </section>

        <section>
          <h2>5. Open-Source Attributions</h2>
          <p>Poffy is built with open-source packages including pdf-lib, @pdf-lib/fontkit, pdfjs-dist, fflate, Tailwind CSS, Vite, Workbox, and the Inter typeface. All trademarks and package copyrights belong to their respective authors and maintainers.</p>
          
        </section>
