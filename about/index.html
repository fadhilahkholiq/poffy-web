        <h1>About Poffy</h1>
        <p>A privacy-first, offline-capable PDF studio running 100% inside your browser memory with WebAssembly and Web Workers.</p>
        
        <section>
          <h2>Core Pillars</h2>
          <ul>
            <li><strong>100% Local Execution:</strong> Files stay inside volatile browser ArrayBuffers from open to export.</li>
            <li><strong>Unified 3-Pane Studio:</strong> Merge, split, sign, redact, impose, convert, extract, and inspect in one workspace.</li>
            <li><strong>Full Offline PWA:</strong> All scripts, WASM binaries, CMaps, and fonts are precached via Workbox.</li>
            <li><strong>Zero Tracking:</strong> connect-src 'self' blocks external APIs, analytics, and third-party CDNs.</li>
          </ul>
        </section>
        <section>
          <h2>How Poffy Works</h2>
          <ol>
            <li><strong>Local File Ingestion:</strong> Dropped or selected PDFs, images, and CBZ archives are read straight into local RAM via FileReader/ArrayBuffer APIs, with nothing uploaded over the network.</li>
            <li><strong>60fps Virtual Page Graph:</strong> Reordering, rotating, duplicating, deleting, and margin-cropping mutate lightweight page descriptors and CSS transforms instantaneously without rewriting binary PDFs on every click.</li>
            <li><strong>Dual Web Worker Pipeline:</strong> UI responsiveness stays smooth because page thumbnails render off-thread via pdfjs-dist OffscreenCanvas, while heavy PDF serialization, redaction, and ZIP packing run in a separate pdf-lib Worker.</li>
            <li><strong>Direct Blob Export &amp; Cleanup:</strong> When you export, a compiled Uint8Array becomes a short-lived local blob: download URL that saves straight to disk and is immediately revoked, alongside bounded LRU bitmap cleanup.</li>
          </ol>
        </section>
        <section>
          <h2>The Technology Behind Poffy</h2>
          <ul>
            <li><strong>pdf-lib &amp; @pdf-lib/fontkit (PDF Assembly, Forms &amp; Metadata Engine):</strong> Handles structural PDF merging, page copying, CropBox/MediaBox imposition, AcroForm flattening, PDFHexString Unicode bookmarks, /EmbeddedFiles attachments, and deep metadata scrubbing cleanly in JavaScript.</li>
            <li><strong>pdfjs-dist &amp; WebAssembly (High-Fidelity Rendering &amp; Rasterization):</strong> Runs Mozilla PDF.js inside render.worker.js with bundled local WASM decoders, JPEG2000/CMaps, and OffscreenCanvas (with isEvalSupported: false) for lazy IntersectionObserver thumbnails, color filters, and visual pixel diffing.</li>
            <li><strong>fflate (Streaming ZIP &amp; CBZ Compression):</strong> Packages burst-split PDFs, extracted embedded images, batch numbered outputs, and zero-compression store-mode .cbz comic archives locally without main-thread stalls.</li>
            <li><strong>Web Workers &amp; Virtual Page Graph (Zero-Copy Concurrency &amp; Responsive Abort):</strong> Transfers ArrayBuffers between the workspace store and background workers with cooperative ABORT_JOB signaling and hard worker-terminate respawn fallback so long jobs cancel immediately.</li>
            <li><strong>Vite MPA, Tailwind CSS v4 &amp; Workbox PWA (Offline Precaching &amp; Strict Security Shell):</strong> Bundles dedicated SEO HTML entry points per route alongside @fontsource/inter and Inter-Regular.ttf fallback fonts into a static Workbox precache with strict Content-Security-Policy headers.</li>
          </ul>
        </section>
